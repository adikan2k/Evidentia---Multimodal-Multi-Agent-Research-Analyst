[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "evidentia"
version = "0.1.0"
description = "Evidentia research agent (rebuild in progress)."
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
    "langchain-anthropic==1.7.12",
    "langchain-core==1.8.4",
    "langfuse==5.2.0",
    "langgraph==1.2.24",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "qdrant-client==1.20.0",
    "rich==15.0.0",
    "tavily-python==0.8.5",
    "trafilatura==2.4.0",
    "voyageai==0.6.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.hatch.build.targets.wheel]
packages = ["evidentia"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
# The old code is kept for reference only and is not held to the new lint rules.
extend-exclude = ["backend", "frontend"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
