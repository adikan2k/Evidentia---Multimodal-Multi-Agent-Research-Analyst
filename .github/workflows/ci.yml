name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_evals:
        description: "Run the full evaluation (uses the service keys and costs money)"
        type: boolean
        default: false

jobs:
  test:
    name: lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: make lint
      - name: Tests (no keys, no network)
        run: make test

  evals:
    name: evaluation
    # Only when started by hand with the box ticked. Never on a push or a pull request.
    if: github.event_name == 'workflow_dispatch' && inputs.run_evals
    needs: test
    runs-on: ubuntu-latest
    # A fresh run makes every model call again: a few thousand calls, four at a time.
    timeout-minutes: 150
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
      # The evals never search the web, but the settings loader requires the variable to exist.
      TAVILY_API_KEY: not-used-by-evals
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked
      - name: Run the evaluation
        run: make evals ARGS=--fresh
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
